
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system_benchmark
spring.datasource.username=${BANKING_BENCHMARK_DB_USERNAME:root}
spring.datasource.password=${BANKING_BENCHMARK_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.sql.init.mode=never

spring.main.web-application-type=none

logging.level.banking_system=WARN

benchmark.enabled=false
benchmark.accounts=100
benchmark.transactions=50000
benchmark.workers=1,5,10,20
